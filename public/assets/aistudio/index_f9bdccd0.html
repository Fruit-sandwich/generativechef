        window.TurboFactory = TurboFactory;
        console.log("⚓ TurboFactory successfully anchored to global window scope.");

    <style>
        :root {
            --bg-color: #ffffff;
            --user-brand-1: #ffcd00;
            --user-brand-2: #1a1a1a;
            --user-brand-3: #7a7a7a;

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: var(--bg-color); }

        #art-canvas {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        #coat-col            { fill: var(--color-coat, #ffcd00); }
        #apron1-col          { fill: var(--color-apron1, #ffcd00); }
        #samosas-plate-col   { fill: var(--color-samosas-plate, #ffcd00); }
        #apron2-col          { fill: var(--color-apron2, #1a1a1a); }

        #apron2-strap-col    { fill: var(--color-apron2-strap, #ffffff); }
        #gloves-col          { fill: var(--color-gloves, #ffffff); }
        #spoon-col           { fill: var(--color-spoon, #ffffff); }
        #spatula-col         { fill: var(--color-spatula, #ffffff); }

        .swatch-wrapper {
            width: 26px;
            height: 26px;
            margin: 0;

            justify-content: center;
            align-items: center;
            border-radius: 50%;

        .color-picker {
            width: 26px; 
            height: 26px;
            border: none;
            padding: 0;
            cursor: pointer;
            background: transparent;
            border-radius: 50%;

        .color-picker::-moz-color-swatch { border: 1px solid rgba(0, 0, 0, 0.2); border-radius: 50%; }
        .color-picker:hover { transform: scale(1.15); transition: transform 0.15s ease; }

        #export-container { margin-top: 8px; display: flex; justify-content: center; }

            width: 32px;
            height: 32px;

            background: #1a1a1a;
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s;
        }
        .export-btn:hover { transform: scale(1.1); }

</head>

<script>
    const ENVIRONMENT = 'development';
    
    let currentChefDNA = {
        traits: {},
        brandedColors: {},
        customColors: {}
    };

    const TRAIT_MANIFEST = {
        "left-hand": ["samosas", "chai", "potatoes", "none"],
        "head": ["head1", "head2"],
        "apron": ["apron1", "apron2", "none"],
        "right-hand": ["spoon", "spatula", "rollingpin", "none"],
        "adornments": ["hibiscus-flower", "hummingbird", "butterfly", "neckerchief", "none"]
    };

    const BASE_BRAND_COLORS = ["#ffcd00", "#1a1a1a", "#ffffff"];

    const VIBRANT_POOL = [
        "#ff6b6b", "#4ecdc4", "#45aaf2", "#a55eea", "#fd9644",
        "#2bcbba", "#eb3b5a", "#fa8231", "#20bf6b", "#0fb9b1",
        "#f78fb3", "#e15f41", "#c44569", "#546de5", "#0be881"
    ];

    function executeGeneration() {
        let seed = Date.now();
        function random() {
            seed = (seed * 1664525 + 1013904223) % 4294967296;
            return seed / 4294967296;
        }

        Object.entries(TRAIT_MANIFEST).forEach(([traitName, options]) => {
            const rolledOption = options[Math.floor(random() * options.length)];
            currentChefDNA.traits[traitName] = rolledOption;
            
            const element = document.getElementById(rolledOption);
            if (element) {
                element.style.removeProperty('display'); 
                element.style.visibility = 'visible';    
            }
        });

        const rolledBrandPalette = [...BASE_BRAND_COLORS];
        for (let i = rolledBrandPalette.length - 1; i > 0; i--) {
            const j = Math.floor(random() * (i + 1));
            [rolledBrandPalette[i], rolledBrandPalette[j]] = [rolledBrandPalette[j], rolledBrandPalette[i]];
        }

        const rolledNonBrandPalette = [
            VIBRANT_POOL[Math.floor(random() * VIBRANT_POOL.length)],
            VIBRANT_POOL[Math.floor(random() * VIBRANT_POOL.length)],
            VIBRANT_POOL[Math.floor(random() * VIBRANT_POOL.length)],
            VIBRANT_POOL[Math.floor(random() * VIBRANT_POOL.length)]
        ];

        const activeShapes = [];
        
        document.querySelectorAll('#art-canvas [id]').forEach(el => {
            let parent = el.parentElement;
            let isHidden = false;
            
            while (parent && parent.tagName !== 'svg') {
                if (parent.style.display === 'none' || parent.getAttribute('style') === 'display:none') {
                    isHidden = true;
                    break;
                }
                parent = parent.parentElement;
            }

            if (!isHidden) {
                const id = el.getAttribute('id');
                if (id && id.endsWith('-col')) {
                    const varName = `--color-${id.replace('-col', '')}`;
                    let hexColor = '#ffffff'; 

                    const category = el.getAttribute('data-color-category');
                    const classString = el.getAttribute('class') || '';      
                    const match = classString.match(/slot-(\d+)/);

                    if (category && match && match[1]) {
                        const slotIndex = (parseInt(match[1]) - 1);
                        if (category === 'brand') {
                            hexColor = rolledBrandPalette[slotIndex % rolledBrandPalette.length];
                        } else if (category === 'nonbrand') {
                            hexColor = rolledNonBrandPalette[slotIndex % rolledNonBrandPalette.length];
                        }
                    } else {
                        const computedStyle = window.getComputedStyle(el);
                        hexColor = rgbToHex(computedStyle.fill);
                    }

                    currentChefDNA.brandedColors[varName] = hexColor;
                    currentChefDNA.customColors[varName] = hexColor;

                    document.documentElement.style.setProperty(varName, hexColor);
                    activeShapes.push({ id: id, varName: varName, initialHex: hexColor });
                }
            }
        });

        buildUI(activeShapes);
    }

    async function loadProductionSVG() {
        const artCanvas = document.getElementById('art-canvas');
        artCanvas.innerHTML = '<div style="color: #666; font-family: monospace; padding: 20px;">LOADING PRODUCTION VECTOR ARTWORK...</div>';

        const assetUrl = "https://arweave.net/HaELFYC9S5TatmpEJRC6xHZXTFHsHbJF8KWrF-uCBvc";

        try {
            const response = await fetch(assetUrl);
            if (!response.ok) throw new Error(`Gateway returned status: ${response.status}`);
            
            const svgRawText = await response.text();
            const parser = new DOMParser();
            const svgDoc = parser.parseFromString(svgRawText, "image/svg+xml");
            const newSvgElement = svgDoc.documentElement;

            newSvgElement.style.width = "100%";
            newSvgElement.style.height = "100%";
            newSvgElement.setAttribute("preserveAspectRatio", "xMidYMid meet");

            artCanvas.innerHTML = "";
            artCanvas.appendChild(newSvgElement);
            
            console.log("🚀 Production SVG successfully mounted from the permaweb!");
            executeGeneration();

        } catch (error) {
            console.error("❌ Failed to load permaweb SVG asset:", error);
            artCanvas.innerHTML = `
                <div style="color: #f66; font-family: monospace; padding: 20px;">
                    ERROR LOADING PRODUCTION ASSET<br>
                    <span style="font-size: 11px; color: #999;">${error.message}</span>
                </div>
            `;
        }
    }

    // 🎯 PROTOCOL ANCHOR: PERMANENT LIGHTWEIGHT STATE UPLOAD
    async function archiveToArweave(dnaObject) {
        try {
            console.log("🚀 Syncing JSON state architecture to Arweave...");

            // 1. Target the bridged module from the global scope context directly
            if (!window.TurboFactory) {
                throw new Error("TurboFactory ES module was not fully loaded onto the global context.");
            }
            
            const TurboFactory = window.TurboFactory;

            // 2. Initialize identity-free bundling engine
            const turbo = TurboFactory.unauthenticated();
            
            const jsonString = JSON.stringify(dnaObject, null, 2);
            const file = new File([jsonString], `ChefDNA_${Date.now()}.json`, { type: "application/json" });
            
            const result = await turbo.uploadFile({
                fileStreamFactory: () => file.stream(),
                fileSizeFactory: () => file.size,
                dataItemOpts: {
                    tags: [
                        { name: "Content-Type", value: "application/json" },
                        { 
                            name: "App-Name", 
                            value: ENVIRONMENT === 'production' 
                                ? "Generative-Chef-Resonance" 
                                : "Generative-Chef-Resonance-Dev" 
                        }, 
                        { name: "Type", value: "Chef-DNA" },
                        { name: "Timestamp", value: Date.now().toString() }
                    ]
                }
            });

            console.log(`✅ DNA anchored successfully! Transaction ID: ${result.id}`);
            alert("Success! Your unique Chef DNA configuration is locked onto Arweave permanently.");

        } catch (err) {
            console.error("❌ Archival failed:", err);
            alert(`Archival failed: ${err.message}`);
        }
    }

    function buildUI(activeShapes) {
        const uiPanel = document.getElementById('ui-instrument');
        if (!uiPanel) return;

        let exportContainer = document.getElementById('export-container');
        if (!exportContainer) {
            exportContainer = document.createElement('div');
            exportContainer.id = 'export-container';
            uiPanel.appendChild(exportContainer);
            showExportButton(exportContainer);
        }

        activeShapes.forEach(shape => {
            if (!document.getElementById(`swatch-${shape.id}`)) {
                const wrapper = document.createElement('div');
                wrapper.className = 'swatch-wrapper';
                wrapper.id = `swatch-${shape.id}`;
                wrapper.title = shape.id.replace('-col', '').toUpperCase();

                const picker = document.createElement('input');
                picker.type = 'color';
                picker.className = 'color-picker';
                picker.value = shape.initialHex;

                picker.addEventListener('input', (e) => {
                    document.documentElement.style.setProperty(shape.varName, e.target.value);
                    currentChefDNA.customColors[shape.varName] = e.target.value;
                });

                wrapper.appendChild(picker);
                uiPanel.appendChild(wrapper);
            }
        });
    }

    // 🎯 THE PIPELINE ORCHESTRATOR
    async function handlePublishWorkflow() {
        console.log("🎬 Starting execution pipeline...");
        try {
            await exportPNG();
            console.log("🔄 Local download clear. Moving to Arweave archival...");
            await archiveToArweave(currentChefDNA);
        } catch (pipelineError) {
            console.error("❌ Pipeline halted due to an error:", pipelineError);
            alert(`Process paused: ${pipelineError.message}`);
        }
    }

    function showExportButton(container) {
        const exportBtn = document.createElement('button');
        exportBtn.className = 'export-btn';
        exportBtn.innerHTML = `
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
        `;
        exportBtn.addEventListener('click', handlePublishWorkflow); 
        container.appendChild(exportBtn);
    }

    function exportPNG() {
        return new Promise((resolve, reject) => {
            const svgDiv = document.getElementById('art-canvas');
            const svgElement = svgDiv.querySelector('svg');
            
            if (!svgElement) {
                return reject(new Error("Export failed: No target SVG found inside the canvas wrapper."));
            }

            const originalSvg = svgElement.cloneNode(true);

            originalSvg.querySelectorAll('[id$="-col"]').forEach(el => {
                const id = el.getAttribute('id');
                const varName = `--color-${id.replace('-col', '')}`;
                const currentColor = document.documentElement.style.getPropertyValue(varName);
                
                if (currentColor) {
                    el.style.fill = currentColor;
                    el.setAttribute('fill', currentColor);
                }
            });

            const canvas = document.createElement('canvas');
            canvas.width = 2100;
            canvas.height = 2970;
            const ctx = canvas.getContext('2d');

            const serializer = new XMLSerializer();
            const svgString = serializer.serializeToString(originalSvg);
            const svgBlob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
            const url = URL.createObjectURL(svgBlob);

            const img = new Image();
            img.crossOrigin = "anonymous";

            img.onload = () => {
                try {
                    ctx.fillStyle = "#ffffff";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0, 2100, 2970);

                    const link = document.createElement("a");
                    link.download = `Chef_${Date.now()}.png`;
                    link.href = canvas.toDataURL("image/png"); 
                    link.click();
                    
                    console.log("💾 1. PNG local download triggered successfully.");
                    resolve();

                } catch (securityError) {
                    reject(securityError);
                } finally {
                    URL.revokeObjectURL(url);
                }
            };
            
            img.onerror = (err) => reject(err);
            img.src = url;
        });
    }

    function rgbToHex(rgb) {
        if (!rgb || rgb.startsWith('#')) return rgb;
        const match = rgb.match(/^rgba?\((\d+),\s*(\d+),\s*(\d+)/);
        if (!match) return '#ffffff';
        return "#" + ((1 << 24) + (parseInt(match[1]) << 16) + (parseInt(match[2]) << 8) + parseInt(match[3])).toString(16).slice(1);
    }

    window.addEventListener('DOMContentLoaded', loadProductionSVG);
</script>
